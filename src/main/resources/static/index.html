<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SGP-Web</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
  <h1 class="h3 mb-4">SGP-Web &middot; Estoque da Confeitaria</h1>

  <div class="row g-4">
    <div class="col-md-5">
      <form id="form-insumo" class="card card-body">
        <h2 class="h5">Novo insumo</h2>
        <input class="form-control mb-2" name="nome" placeholder="Nome" required>
        <input class="form-control mb-2" name="unidade" placeholder="Unidade (g, ml, un)" required>
        <input class="form-control mb-2" name="quantidadeEstoque" type="number" step="0.001" min="0" placeholder="Estoque" required>
        <input class="form-control mb-2" name="estoqueMinimo" type="number" step="0.001" min="0" placeholder="Estoque mínimo" required>
        <button class="btn btn-primary">Salvar</button>
        <div id="erro" class="text-danger mt-2"></div>
      </form>
    </div>
    <div class="col-md-7">
      <div class="card card-body">
        <h2 class="h5">Insumos</h2>
        <table class="table table-sm align-middle mb-0">
          <thead><tr><th>Nome</th><th>Estoque</th><th>Mínimo</th><th></th></tr></thead>
          <tbody id="insumos"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  const tbody = document.getElementById('insumos');
  const erro = document.getElementById('erro');

  async function carregar() {
    const insumos = await (await fetch('/api/insumos')).json();
    tbody.innerHTML = '';
    for (const i of insumos) {
      const tr = document.createElement('tr');
      if (i.abaixoDoMinimo) tr.className = 'table-warning';
      for (const texto of [i.nome, `${i.quantidadeEstoque} ${i.unidade}`, i.estoqueMinimo]) {
        const td = document.createElement('td');
        td.textContent = texto;
        tr.appendChild(td);
      }
      const acao = document.createElement('td');
      const botao = document.createElement('button');
      botao.className = 'btn btn-sm btn-outline-danger';
      botao.textContent = 'Excluir';
      botao.onclick = async () => {
        const r = await fetch(`/api/insumos/${i.id}`, { method: 'DELETE' });
        erro.textContent = r.ok ? '' : (await r.json()).erro;
        carregar();
      };
      acao.appendChild(botao);
      tr.appendChild(acao);
      tbody.appendChild(tr);
    }
  }

  document.getElementById('form-insumo').addEventListener('submit', async e => {
    e.preventDefault();
    const dados = Object.fromEntries(new FormData(e.target));
    const r = await fetch('/api/insumos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(dados)
    });
    erro.textContent = r.ok ? '' : 'Dados inválidos';
    if (r.ok) e.target.reset();
    carregar();
  });

  carregar();
</script>
</body>
</html>
